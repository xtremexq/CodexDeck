<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AIDeck Router</title><link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#routes"><img src="logo.svg" width="35" height="35" alt=""><span>AIDeck<span class="brand-sub">ROUTER</span></span></a>
      <div class="workspace"><span class="workspace-mark">L</span><div>Personal workspace<small>LOCAL · YOUR MACHINE</small></div></div>
      <nav aria-label="Main navigation" id="nav"></nav>
      <div class="sidebar-bottom"><div class="side-note">One API.<br>Every connection.</div><button class="connection" id="connection"><span class="status-dot"></span><span id="connection-label">Connect gateway</span><span>↗</span></button><small class="version">AIDeck Router · v0.1.0</small></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong id="crumb">Routes</strong></div><div class="top-actions"><span class="endpoint">127.0.0.1:5147</span><button class="icon-button" id="refresh" aria-label="Refresh workspace">↻</button></div></header>
      <main id="main" tabindex="-1"><div class="loading">Connecting to your gateway…</div></main>
    </div>
  </div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
