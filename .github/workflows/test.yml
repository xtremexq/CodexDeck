name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository hygiene
        run: ./Test-Repository.ps1
      - name: Core and account regression tests
        run: |
          ./suite/Test-Deck.ps1
          ./suite/Test-DeckCommands.ps1
          ./suite/Test-DeckScheduler.ps1
          ./suite/Test-DeckScheduledMessages.ps1
          ./suite/Test-DeckBackup.ps1
          ./suite/Test-DeckAccountTools.ps1
          ./suite/Test-DeckStorage.ps1
          ./suite/Test-DeckFailover.ps1
          ./suite/Test-DeckEnvironments.ps1
          ./suite/Test-DeckBundledSkills.ps1
          ./suite/Test-DeckSkillCatalog.ps1
          ./suite/Test-DeckEnvironmentLaunch.ps1
          ./suite/Test-CodexAuth.ps1
          ./suite/Test-DeckTerminal.ps1
          ./suite/Test-CodexLoopUsage.ps1
      - name: Failover proxy regression tests
        run: node ./suite/Test-DeckFailover.cjs
      - name: Trajectory and efficiency inspector regression tests
        run: node ./suite/Test-DeckInspector.cjs
      - name: PowerShell 7 account-wrapper regression tests
        shell: pwsh
        run: ./suite/Test-CodexAuth.ps1
      - name: Auto-compact state machine tests
        run: node ./suite/Test-DeckAutoCompact.cjs
      - name: WPF smoke test
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File ./suite/Codex-Deck.ps1 -SmokeTest
      - name: Installer payload
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'deck-install'
          ./Install-CodexDeck.ps1 -InstallHome $destination -SkipPath
          if (!(Test-Path "$destination/.codex-loop/deck/assets/codex-deck.ico")) { throw 'Missing installed icon' }
          if (!(Test-Path "$destination/.codex-loop/Deck.AccountResources.ps1")) { throw 'Missing installed account resource shortcuts' }
          if (!(Test-Path "$destination/.codex-loop/Deck.Storage.ps1")) { throw 'Missing installed storage maintenance' }
          if (!(Test-Path "$destination/.codex-loop/Deck.AutoCompact.cjs")) { throw 'Missing installed auto-compact client' }
          if (!(Test-Path "$destination/.codex-loop/Deck.AutoCompact.Sidecar.cjs")) { throw 'Missing installed native auto-compact sidecar' }
          if (!(Test-Path "$destination/.codex-loop/Deck.Inspector.cjs")) { throw 'Missing installed trajectory and efficiency inspector' }
          if (!(Test-Path "$destination/.codex-loop/accounts/pool/skills/debug-swarm/SKILL.md")) { throw 'Missing globally enabled Deck skill' }
          if (!(Test-Path "$destination/.codex-loop/accounts/pool/skills/ui-design/SKILL.md")) { throw 'Missing UIZZE skill in pooled environment' }
          if (Test-Path "$destination/.codex-loop/deck/catalog/aas-index.json") { throw 'Optional AAS catalog was installed by default' }
          if (!(Test-Path "$destination/.local/bin/deck-skills.cmd")) { throw 'Missing skill catalog CLI' }
          foreach ($name in 'account','pool','usage','delay','schedule','check','deck','autocompact') {
            if (!(Test-Path "$destination/.local/bin/$name.cmd")) { throw "Missing installed local shell command: $name" }
            if ($name -ne 'deck' -and (Test-Path "$destination/.codex-loop/accounts/pool/skills/$name/.codexdeck-managed")) { throw "Legacy AI-backed command skill remains: $name" }
          }
          if (Test-Path "$destination/.local/bin/compact.cmd") { throw 'Legacy compact wrapper must not be installed' }
