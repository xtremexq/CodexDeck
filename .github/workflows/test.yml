name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository hygiene
        run: ./Test-Repository.ps1
      - name: Core and account regression tests
        run: |
          ./suite/Test-Deck.ps1
          ./suite/Test-DeckCommands.ps1
          ./suite/Test-DeckScheduler.ps1
          ./suite/Test-DeckBackup.ps1
          ./suite/Test-DeckAccountTools.ps1
          ./suite/Test-DeckFailover.ps1
          ./suite/Test-DeckEnvironments.ps1
          ./suite/Test-DeckEnvironmentLaunch.ps1
          ./suite/Test-CodexAuth.ps1
          ./suite/Test-DeckTerminal.ps1
          ./suite/Test-CodexLoopUsage.ps1
      - name: Failover proxy regression tests
        run: node ./suite/Test-DeckFailover.cjs
      - name: WPF smoke test
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File ./suite/Codex-Deck.ps1 -SmokeTest
      - name: Installer payload
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'deck-install'
          ./Install-CodexDeck.ps1 -InstallHome $destination -SkipPath
          if (!(Test-Path "$destination/.codex-loop/deck/assets/codex-deck.ico")) { throw 'Missing installed icon' }
          foreach ($name in 'account','pool','usage','check') {
            if (!(Test-Path "$destination/.local/bin/$name.cmd")) { throw "Missing installed local shell command: $name" }
            if (Test-Path "$destination/.codex-loop/accounts/pool/skills/$name/.codexdeck-managed") { throw "Legacy AI-backed command skill remains: $name" }
          }
